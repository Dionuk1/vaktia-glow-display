<!doctype html><html lang="sq"><head><meta charset="utf-8"><title>VaktiaKS</title>
<style>
:root{--bg:#0B1E24;--card:#18282E;--teal:#00D9A3;--lime:#B6FF2E;--fg:#E6F4F1;--mut:#8AA3A0}
*{box-sizing:border-box}body{margin:0;width:380px;min-height:560px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:14px;position:relative}
header{display:flex;align-items:center;gap:10px}header img{width:36px;height:36px;border-radius:10px}
h1{font-size:16px;margin:0}h1 span{color:var(--teal)}.mut{color:var(--mut);font-size:11px}
.gear{margin-left:auto;background:var(--card);color:var(--fg);border:1px solid #00D9A355;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.gear:hover{border-color:var(--teal)}
.loc{margin-top:8px;font-size:11px;color:var(--teal)}
.next{margin:10px 0;padding:10px;border-radius:14px;background:var(--card);border:1px solid #00D9A355;text-align:center}
.cd{font-size:30px;font-weight:800;color:var(--lime);font-variant-numeric:tabular-nums}
ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
li{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:10px;font-size:14px;background:#ffffff08;border:1px solid transparent}
li b{font-variant-numeric:tabular-nums}
li.next-up{border-color:#B6FF2E44}li.next-up small{color:var(--lime)}
li small{font-size:10px;color:var(--mut);margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
li.on{background:linear-gradient(90deg,#00D9A333,#B6FF2E14);color:var(--teal);font-weight:700;border-color:var(--teal);animation:breathe 2.4s ease-in-out infinite}
li.on small{color:var(--teal)}
@keyframes breathe{0%,100%{box-shadow:0 0 6px #00D9A344}50%{box-shadow:0 0 18px #00D9A3aa,inset 0 0 8px #00D9A333}}
.fri{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fri div{padding:7px 12px;border-radius:10px;background:#B6FF2E14;color:var(--lime);font-size:13px;display:flex;justify-content:space-between}
.fri div.on{border:1px solid var(--lime);animation:breathe 2.4s ease-in-out infinite}
a{color:var(--teal);font-size:11px;display:block;text-align:center;margin-top:10px}
body.compact li{padding:4px 10px;font-size:13px}body.compact .cd{font-size:24px}body.compact .next{padding:6px;margin:8px 0}
body.compact .fri div{padding:4px 10px;font-size:12px}
/* Settings drawer */
.ov{position:fixed;inset:0;background:#0B1E24cc;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--card);border-left:1px solid #00D9A355;padding:16px;transform:translateX(100%);transition:transform .25s;overflow:auto}
.ov.open .panel{transform:none}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between}
.panel h2 button{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer}
.field{margin-bottom:14px}.field>span{display:block;font-size:11px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--fg);padding:7px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--teal);color:var(--bg);font-weight:700}
select{width:100%;background:var(--bg);color:var(--fg);border:1px solid #00D9A355;border-radius:8px;padding:7px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff10;font-size:13px}
.sw{appearance:none;width:38px;height:22px;border-radius:11px;background:#ffffff22;position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:left .2s}
.sw:checked{background:var(--teal)}.sw:checked::after{left:19px;background:var(--bg)}
.saved{font-size:11px;color:var(--lime);text-align:center;margin-top:10px;opacity:0;transition:opacity .3s}.saved.show{opacity:1}
</style></head><body>
<header><img src="icon-192.png" alt=""><div><h1>VAKTIA<span>KS</span></h1><div class="mut" id="date"></div></div><button class="gear" id="openSettings" title="Cilësimet" aria-label="Cilësimet">⚙️</button></header>
<div class="loc" id="loc"></div>
<div class="next"><div class="mut" id="nextLabel"></div><div class="cd" id="cd">--:--:--</div></div>
<ul id="list"></ul>
<div class="fri" id="fri"></div>
<a href="https://vaktia-ks.lovable.app" target="_blank">Hap VaktiaKS të plotë →</a>

<div class="ov" id="ov"><div class="panel" role="dialog" aria-label="Cilësimet">
  <h2>Cilësimet <button id="closeSettings" aria-label="Mbyll">✕</button></h2>
  <div class="field"><span>Shteti</span><div class="seg"><button data-region="ks">Kosovë</button><button data-region="al">Shqipëri</button></div></div>
  <div class="field" id="ksField"><span>Qyteti (BIK)</span><select id="city"></select></div>
  <div class="field" id="alField"><span>Qyteti / Këshilli (KMSH)</span><select id="alCity"></select></div>
  <div class="field"><span>Preferencat</span>
    <label class="tg">Njoftime për namazet <input type="checkbox" class="sw" id="notify"></label>
    <label class="tg">Tingull në njoftime <input type="checkbox" class="sw" id="sound"></label>
    <label class="tg">Pamje kompakte <input type="checkbox" class="sw" id="compact"></label>
  </div>
  <div class="saved" id="saved">✓ U ruajt</div>
</div></div>
<script type="module" src="popup.js"></script></body></html>
